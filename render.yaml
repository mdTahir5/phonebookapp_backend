services:
  # Spring Boot Backend Web Service on Render
  - type: web
    name: phonebookapp01-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
        # Example: jdbc:mysql://<aiven-host>.aivencloud.com:<port>/defaultdb?sslMode=REQUIRED&serverTimezone=UTC
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
        # Example: avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: CORS_ALLOWED_ORIGINS
        sync: false
        # Example: https://your-phonebook-frontend.netlify.app
