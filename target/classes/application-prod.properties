# Production Profile Configuration
spring.application.name=phonebook-backend
server.port=${PORT:8080}

# Aiven MySQL Database Configuration
# In production, SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, and SPRING_DATASOURCE_PASSWORD must be provided
# For Aiven MySQL, SSL is required: sslMode=REQUIRED or verifyServerCertificate=true
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Optimization for Production & Cloud Databases
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=PhonebookHikariPool

# JPA / Hibernate Configuration for Production
# In production, validate ensures the schema matches entity definitions without accidental drops
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration - must be provided via environment variable in production
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Dynamic CORS - allows Netlify domain or custom production domains
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Spring Boot Actuator & Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Logging
logging.level.com.phonebook=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
